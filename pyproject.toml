[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "r1-fr-reliability"
version = "1.0.1"
description = "Label-free reliability diagnostics for FR-I/FR-II classifiers applied to blind radio survey catalogues"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Raj Kondekar" }]
keywords = [
    "radio astronomy",
    "radio galaxies",
    "Fanaroff-Riley classification",
    "FIRST survey",
    "domain shift",
    "out-of-distribution detection",
    "convolutional neural networks",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "astropy>=8.0",
    "numpy>=2.0",
    "pandas>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "Pillow>=11.0",
    "requests>=2.32",
    "pyarrow>=18.0",
    # torch and torchvision are installed from the PyTorch index, not PyPI.
    # See requirements.txt for the exact pins used to produce the published results.
]

[project.optional-dependencies]
catalogue = ["astroquery>=0.4.10", "pyvo>=1.5"]
test = ["pytest>=8.0"]

[project.urls]
Repository = "https://github.com/astrophile73/radio-astronomy-ml-morphology"

[tool.setuptools]
packages = ["r1"]

[tool.pytest.ini_options]
markers = ["slow: full-sample regression checks (run with -m slow)"]
addopts = "-q -m 'not slow'"
testpaths = ["tests"]
pythonpath = ["."]
